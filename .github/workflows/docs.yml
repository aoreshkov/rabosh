name: Docs

# The aggregated Dokka site for the six published modules, deployed to GitHub Pages.
#
# Built from `main` rather than from a tag, deliberately. The Kotlin API is major-version zero and
# free to move — `COMPATIBILITY.md` says so — which makes documentation of the last release a
# description of something a reader is being told not to rely on. What is useful is the API as it
# stands, so that is what is published, and the tag-versioned copy of each module's KDoc already
# exists as the `javadoc` classifier artefact on Maven Central for anyone who needs to pin one.
#
# Every action is pinned to a commit SHA; see the note at the top of ci.yml.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# One deployment at a time, and never cancelled. A cancelled `deploy-pages` can leave the Pages
# service holding a half-applied deployment; the run is short enough that queueing costs nothing.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2

      - name: Set up JDK 25
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: 25

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2

      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      # The root `dokkaGenerate` is the aggregating one: `rabosh.api-docs` declares a `dokka`
      # dependency on every module with a committed ABI dump, so the site covers exactly what is
      # published. It fails at configuration time if that set is empty.
      - name: Generate the API documentation
        run: ./gradlew dokkaGenerate --stacktrace

      # Asserted rather than assumed. Dokka can complete over an empty module set and leave a site
      # with a working index and nothing behind it — a green deployment of nothing, which is the
      # failure `CentralBundleReport` exists to catch one directory along. Checked here because the
      # thing being deployed is the directory, not the task that wrote it.
      - name: Check the site covers every published module
        run: |
          set -euo pipefail
          expected=$(find . -maxdepth 3 -path './*/api/*.api' -printf '%h\n' \
            | sed 's|^\./||; s|/api$||' | sort -u)
          missing=""
          for module in $expected; do
            [ -d "build/dokka/html/$module" ] || missing="$missing $module"
          done
          if [ -n "$missing" ]; then
            echo "::error::The generated site is missing published modules:$missing"
            exit 1
          fi
          echo "Documented: $(echo "$expected" | tr '\n' ' ')"

      - name: Upload the site
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: build/dokka/html

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    # Deployment is by OIDC — no token, no `gh-pages` branch, and nothing in this job can write to
    # the repository's contents.
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
