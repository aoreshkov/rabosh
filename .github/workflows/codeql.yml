name: CodeQL

# Static analysis of the engine's own source, which until 2026-09-10 nothing did.
#
# It was excluded for a real reason and the reason expired. CodeQL's `java-kotlin` analysis used to
# stop at Kotlin 2.3.20 while this build was on 2.4.x, so it could not read the source at all and
# adding it would have produced a red check that told nobody anything. The supported range is now
# **Kotlin 1.8.0 to 2.4.20** and this build is on 2.4.20, which is the condition `CONTRIBUTING.md`
# set for revisiting: "it goes in when support lands."
#
# The code most in need of it is exactly this codebase. Hand-written buffer and offset arithmetic, a
# hand-rolled JSON parser, a varint codec, a front-coded key block and a Thompson NFA matcher — all
# of them parsing input the engine did not write, all of them under no static analysis at all until
# now. It also closes the `SAST` check that has been scoring zero on the OpenSSF badge.
#
# Every action is pinned to a commit SHA; see the note at the top of ci.yml.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Queries and the bundled CLI move without this repository changing, so a finding can appear in
    # code that has not been touched. Weekly, off-hours, on a day nothing else is scheduled.
    - cron: '41 5 * * 2'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze java-kotlin
    runs-on: ubuntu-latest
    permissions:
      security-events: write   # upload the results to the code-scanning dashboard
      contents: read
      actions: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nothing in this job uses git after the clone, so the job token has no reason to sit
          # in `.git/config` where every build plugin on the classpath can read it.
          persist-credentials: false

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Set up JDK 25
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 25

      # `build-mode: manual` rather than `autobuild`. CodeQL extracts Kotlin by tracing the compiler
      # as it runs, so *how* the build runs decides whether anything is extracted at all — and the
      # settings that make that work are the opposite of the ones this build uses every day. They
      # have to be visible in a step somebody can read, not inside a black box.
      - name: Initialise CodeQL
        uses: github/codeql-action/init@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
        with:
          languages: java-kotlin
          build-mode: manual
          queries: security-and-quality

      # Only the main sources: `compileKotlin` exists in every module and compiles exactly what
      # ships. The four flags are each load-bearing, and none of them is a preference.
      #
      #  --no-daemon                      a build handed to an existing daemon compiles in a process
      #                                   CodeQL never started, so nothing is traced
      #  -Dkotlin.compiler.execution.strategy=in-process
      #                                   same problem one level down: the Kotlin compile daemon is
      #                                   another process CodeQL cannot see into
      #  --no-build-cache                 a cache hit produces class files without compiling, and an
      #                                   extractor traces compilation, not outputs
      #  --no-configuration-cache         same, for configuration; and it is on by default here
      #
      # Getting any of these wrong does not fail — it extracts *less*, which is the failure mode this
      # repository is most careful about elsewhere. The step after this one is what makes it loud.
      - name: Build the main sources under the CodeQL tracer
        run: |
          ./gradlew compileKotlin \
            --no-daemon \
            --no-build-cache \
            --no-configuration-cache \
            -Dkotlin.compiler.execution.strategy=in-process \
            --stacktrace

      # CodeQL fails with "No source code was seen during the build" when the tracer observed
      # nothing, which is what turns a mis-flagged build above into a red check rather than a green
      # one over an empty database. That is the property this workflow needs and it is CodeQL's own,
      # so nothing is asserted here twice.
      - name: Analyse
        uses: github/codeql-action/analyze@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
        with:
          category: /language:java-kotlin
