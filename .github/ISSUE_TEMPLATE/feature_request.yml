name: Feature request
description: Something the engine should be able to do and cannot.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Please open one of these before writing the code for anything that adds a public API, changes
        a file format, or adds a dependency. [CONTRIBUTING.md](https://github.com/aoreshkov/rabosh/blob/main/CONTRIBUTING.md)
        lists four rules that can make an otherwise good change unmergeable, and finding that out
        after the work is done is nobody's idea of a good time.

  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: >
        What are you trying to do that you cannot do today? Describe the situation rather than the
        feature — the best version of the answer is often not the one that was asked for.
    validations:
      required: true

  - type: textarea
    id: shape
    attributes:
      label: What it might look like
      description: An API sketch, a query, a configuration option. Rough is fine.
      render: kotlin

  - type: textarea
    id: cost
    attributes:
      label: What it would cost
      description: >
        If you have a view: what would this add to a file on disk, to a query's answer, or to the
        engine's dependencies? Three things in particular are close to immovable — on-disk ids are
        permanent, an index may change query speed but never query answers, and the runtime scope has
        no dependencies in it. A proposal that runs into one of those is not automatically dead, but
        it needs an argument.

  - type: textarea
    id: alternatives
    attributes:
      label: What you tried instead
      description: Workarounds you found, and why they are not enough.
